seed: 42

model:
  hidden_size: 192
  num_layers: 3
  num_heads: 6
  intermediate_size: 384
  dropout: 0.1
  max_seq_len: 256
  pooling: class_aware_attentive
  class_aware_pooling: true
  session_group_by: service_host_proto
  session_window_n: 8
  session_stride: 1
  session_min_flows: 2
  session_min_purity: 0.8
  session_train_min_purity: 0.8
  session_eval_min_purity: 0.0
  session_pooling_strategy: transformer_attentive
  session_flow_representation: shared_encode
  session_transformer_layers: 1
  session_transformer_heads: 6
  session_transformer_intermediate_size: 384

training:
  batch_size: 64
  epochs: 5
  learning_rate: 0.0005
  weight_decay: 0.01
  val_ratio: 0.1
  test_ratio: 0.2
  num_workers: 0
  loss: weighted_ce
