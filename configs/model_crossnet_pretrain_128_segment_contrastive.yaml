seed: 42
model:
  hidden_size: 128
  num_layers: 2
  num_heads: 4
  intermediate_size: 256
  dropout: 0.1
  max_seq_len: 256
  pooling_strategy: mean

training:
  batch_size: 64
  epochs: 5
  learning_rate: 0.0005
  weight_decay: 0.01
  val_ratio: 0.1
  test_ratio: 0.2
  num_workers: 0
  loss: ce

pretraining:
  objective: segment_contrastive
  batch_size: 64
  epochs: 5
  learning_rate: 0.0005
  weight_decay: 0.01
  segment_contrastive_weight: 1.0
  segment_contrastive_temperature: 0.2
  min_segment_tokens: 2
  rtd_weight: 0.0
  contrast_weight: 0.0

