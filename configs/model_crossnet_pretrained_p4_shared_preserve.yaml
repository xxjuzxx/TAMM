seed: 42
model:
  hidden_size: 128
  num_layers: 2
  num_heads: 4
  intermediate_size: 256
  dropout: 0.1
  max_seq_len: 256
  pooling_strategy: class_aware_attentive
  class_aware_pooling: true

training:
  batch_size: 64
  epochs: 5
  learning_rate: 0.0005
  weight_decay: 0.01
  val_ratio: 0.1
  test_ratio: 0.2
  num_workers: 0
  loss: weighted_ce
  use_shared_representation_preservation: true
  shared_representation_weight: 0.05
  shared_representation_mode: cosine
  shared_representation_checkpoint: outputs/results/large_pretrain_flow_contrastive_crossnetvocab_e10/best.pt
