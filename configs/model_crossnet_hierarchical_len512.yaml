seed: 42
model:
  hidden_size: 128
  num_layers: 2
  num_heads: 4
  intermediate_size: 256
  dropout: 0.1
  max_seq_len: 512

training:
  batch_size: 64
  epochs: 5
  learning_rate: 0.0005
  weight_decay: 0.01
  val_ratio: 0.1
  test_ratio: 0.2
  num_workers: 0
  loss: weighted_ce
  use_hierarchical_classifier: true
  lambda_binary: 0.0
  lambda_coarse: 1.0
  lambda_fine: 0.0
  hierarchical_gated_inference: false
