seed: 42
model:
  hidden_size: 128
  num_layers: 2
  num_heads: 4
  intermediate_size: 256
  dropout: 0.1
  max_seq_len: 512
  pooling_strategy: class_aware_attentive
  class_aware_pooling: true
  use_anomaly_features: true
  use_service_prototype_distance: true
  use_class_prototype_distance: false
  anomaly_feature_dim: 16

training:
  batch_size: 64
  epochs: 5
  learning_rate: 0.0005
  weight_decay: 0.01
  val_ratio: 0.1
  test_ratio: 0.2
  num_workers: 0
  loss: weighted_ce
  anomaly_features:
    score_method: cosine
    normalize: l2
    include_special: false
    use_service_prototype_distance: true
    use_class_prototype_distance: false
    anomaly_feature_dim: 16
