seed: 42
model:
  hidden_size: 128
  num_layers: 2
  num_heads: 4
  intermediate_size: 256
  dropout: 0.1
  max_seq_len: 256
  pooling_strategy: mean

training:
  batch_size: 64
  epochs: 5
  learning_rate: 0.0005
  weight_decay: 0.01
  val_ratio: 0.1
  test_ratio: 0.2
  num_workers: 0
  loss: ce

pretraining:
  objective: flow_context_contrastive
  batch_size: 64
  epochs: 5
  learning_rate: 0.0005
  weight_decay: 0.01
  flow_contrastive_weight: 1.0
  flow_contrastive_temperature: 0.2
  context_contrastive_weight: 0.05
  context_contrastive_temperature: 0.2
  context_group_by: service_host_proto
  context_positive_mode: next
  view_token_drop_prob: 0.05
  view_span_drop_prob: 0.02
  view_span_drop_length: 3
  view_mask_prob: 0.10
  rtd_weight: 0.0
  contrast_weight: 0.0
  segment_contrastive_weight: 0.0
  paragraph_contrastive_weight: 0.0
